name: NAA macOS POC framework

on:
  workflow_dispatch:
  push:
    branches:
      - sameerag/naa-macos-poc

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build macOS framework
        run: |
          xcodebuild build \
            -workspace MSAL.xcworkspace \
            -scheme "MSAL (Mac Framework)" \
            -configuration Debug \
            -destination "platform=macOS" \
            -derivedDataPath build/DerivedData \
            -jobs 2 \
            COMPILER_INDEX_STORE_ENABLE=NO \
            RUN_CLANG_STATIC_ANALYZER=NO

      - name: Package XCFramework
        shell: bash
        run: |
          set -euo pipefail
          framework="build/DerivedData/Build/Products/Debug/MSAL.framework"
          if [[ ! -d "$framework" ]]; then
            echo "MSAL.framework was not produced under build/."
            exit 1
          fi
          xcodebuild -create-xcframework \
            -framework "$framework" \
            -output build/MSAL.xcframework

      - uses: actions/upload-artifact@v4
        with:
          name: MSAL-macOS-xcframework
          path: build/MSAL.xcframework
          if-no-files-found: error

  test:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run macOS unit tests
        run: ./build.py --targets macFramework --no-clean --no-xcpretty
